<text class="t-value" x="615.0" y="307.6" text-anchor="middle">0.21%</text>
<text class="t-tick" x="615.0" y="350" text-anchor="middle">50 ms</text>
<text class="t-tick" x="615.0" y="366" text-anchor="middle">51.9 ms</text>
<text class="t-tick" x="396.0" y="392" text-anchor="middle">server delay, and what a round trip cost at it</text>
<text class="t-foot" x="28" y="414">go 1.24.4 · darwin/arm64 · 10 CPUs · commit 9fca157 · 2026-10-12 04:50 UTC, median of 3 runs · run by hand with make report</text>
</g>
</svg>
