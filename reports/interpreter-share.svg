<text class="t-tick" x="323.0" y="350" text-anchor="middle">1 ms</text>
<text class="t-tick" x="323.0" y="366" text-anchor="middle">1.4 ms</text>
<text class="t-value" x="469.0" y="305.4" text-anchor="middle">0.40%</text>
<text class="t-tick" x="469.0" y="350" text-anchor="middle">10 ms</text>
